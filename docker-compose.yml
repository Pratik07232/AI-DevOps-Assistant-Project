services:

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
     ["5001:5001"]

  backend:
     build: ./backend
     container_name: backend
     ports: 
        ["5000:5000"]
     depends_on:
        - ai-service
  
  frontend:
    build: ./Frontend
    container_name: frontend
    ports:
      ["3000:80"]
    depends_on:
        - backend
         