name: AI DevOps Assistant CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Test Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: |
          python -m pip install -r ai-service/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt

      - name: Test AI service
        run: |
          python -m py_compile ai-service/app.py

      - name: Test backend
        run: |
          python -m py_compile backend/app.py

  build:
    name: Build Docker Images
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build AI service image
        run: |
          docker build -t ai-devops-assistant-ai-service:latest ./ai-service

      - name: Build backend image
        run: |
          docker build -t ai-devops-assistant-backend:latest ./backend

      - name: Build frontend image
        run: |
          docker build -t ai-devops-assistant-frontend:latest ./Frontend

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ai-deployment.yaml
          kubectl apply -f k8s/ai-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment ai-service
          kubectl rollout restart deployment backend
          kubectl rollout restart deployment frontend

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment ai-service
          kubectl rollout status deployment backend
          kubectl rollout status deployment frontend

      - name: Verify Kubernetes
        run: |
          kubectl get pods
          kubectl get services