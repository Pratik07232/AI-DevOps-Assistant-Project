apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
        - name: ai-service
          image: ai-devops-assistant-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001